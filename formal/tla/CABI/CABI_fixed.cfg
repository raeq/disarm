SPECIFICATION Spec
\* The proposed fix (NULL and invalid UTF-8 rejected at the boundary) with the
\* read-only rule documented: every input the header admits.
CONSTANTS
    MaxCalls = 3
    Inputs = {"valid", "invalid_utf8", "null"}
    ClientWrites = FALSE
    Fixed = TRUE
INVARIANTS TypeOK NoNullArgUB NoInvalidUtf8UB NoWriteToStatic NoLayoutMismatch NoDoubleFree ResultExclusive NoLeak
