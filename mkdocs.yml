site_name: disarm
site_url: https://docs.disarm.dev/
site_description: Unicode canonicalization and TR39 visual confusable analysis — building blocks for text-security pipelines plus standards-based phonetic transliteration, powered by Rust
site_author: Richard Quinn
repo_url: https://github.com/raeq/disarm
repo_name: raeq/disarm
edit_uri: edit/main/docs/
use_directory_urls: false

# The footer is the only element on every page, which makes it where the docs
# declare they belong to https://disarm.dev/ (#692). The two sites had no link
# between them in either direction.
copyright: "&copy; 2026 the <a href='https://github.com/raeq/disarm/graphs/contributors'>disarm team</a>. <a href='https://disarm.dev/'>disarm.dev</a>"

theme:
  name: readthedocs
  # overrides/main.html — the theme ships a main.html whose only content is a
  # comment saying customisations belong here. It carries the footer build
  # provenance and the og/schema.org markup naming disarm.dev as the parent
  # site (#692).
  custom_dir: overrides/
  highlightjs: true
  hljs_languages:
    - python
    - rust
    - bash
    - java
    - kotlin

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [python]
          options:
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            heading_level: 3
            members_order: source
            show_signature_annotations: true
            separate_signature: true
            docstring_style: google

# The commit each build came from and the version a reader can install (#641),
# published into config.extra and rendered in the footer by overrides/main.html
# (#692). The site deploys on every push to main; the package deploys on a tag,
# and nothing on the page used to say those were different.
hooks:
  - scripts/mkdocs_build_banner.py

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - def_list
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - attr_list
  - md_in_html

