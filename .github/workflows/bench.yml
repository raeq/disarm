name: Benchmarks

on:
  push:
    branches: [main]
    paths:
      - "**.rs"
      - "**.py"
      - "**.toml"
      - "uv.lock"
      - "benchmarks/**"

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  bench:
    name: Benchmarks (smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2

      - name: Criterion benchmarks (short run)
        run: cargo bench --no-default-features --bench bench_core -- --warm-up-time 1 --measurement-time 2 --sample-size 10

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install maturin
        run: pip install maturin[patchelf]

      - name: Python quick benchmarks
        # A benchmark run against a dev-profile wheel measures nothing anyone can
        # compare against (#658). Smoke test or not, the numbers this step prints
        # have to describe the artifact the project ships.
        run: |
          maturin build --release --out dist
          pip install dist/*.whl
          python benchmarks/bench_quick.py
