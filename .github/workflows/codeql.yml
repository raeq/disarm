name: CodeQL

on:
  pull_request:
    branches: [main]
    paths:
      - "**.py"
      # NB: "**.rs" intentionally omitted — the analysis matrix is
      # [python, actions] (Rust is covered by clippy in ci.yml), so a Rust-only
      # change should not trigger this workflow. The weekly schedule still scans
      # the whole repo.
      - ".github/workflows/**"
  schedule:
    - cron: "0 6 * * 1"  # Weekly scan of default branch (Monday 06:00 UTC)

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    # Uploading results needs `security-events: write`; scoped to this job.
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
        # Rust analysis excluded: CodeQL's Rust support is limited and
        # cargo clippy (in ci.yml) catches more issues with zero false positives.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
