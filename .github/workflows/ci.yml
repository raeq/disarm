name: CI

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1"  # Weekly RustSec advisory scan (Monday 05:00 UTC)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:

  # ── Detect whether code changed ─────────────────────────────────
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
      ruby: ${{ steps.filter.outputs.ruby }}
      node: ${{ steps.filter.outputs.node }}
      java: ${{ steps.filter.outputs.java }}
      cabi: ${{ steps.filter.outputs.cabi }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: filter
        with:
          filters: |
            code:
              - '**.py'
              - '**.rs'
              - '**.toml'
              - '**.tsv'
              - '.github/workflows/**'
            docs:
              - 'docs/**'
              - 'mkdocs.yml'
              - '**.md'
              - '.github/workflows/**'
            # The Ruby binding must rebuild when ITS OWN code changes AND when the
            # CORE it wraps changes (#374): a core API change (e.g. the 0.10
            # tuple→struct return) can break the gem, and that break must surface
            # on the same PR — not at release. Core = src/**, build.rs, the crate
            # manifests; binding = bindings/ruby/**.
            ruby:
              - 'bindings/ruby/**'
              - 'src/**'
              - 'build.rs'
              - 'Cargo.toml'
              - '.github/workflows/ci.yml'
              # `docs/**` matches the Node filter below: the Ruby `# =>` doc
              # examples re-validate against the freshly-built LOCAL-core gem when
              # a usage tab or the API page changes. Previously only
              # publish-ruby.yml covered that, by running its whole gem pipeline on
              # every docs PR — a 4.7-minute job for a check this one already owns,
              # and one that tested the PUBLISHED core rather than the PR's.
              - 'docs/**'
              - 'scripts/check_doc_ruby_examples.rb'
            # Same drift-gate rationale as `ruby` (#374): rebuild the Node binding
            # when ITS code OR the CORE it wraps changes (#44). `docs/**` is included
            # so the Node `// =>` doc examples re-validate against the built addon
            # when a usage tab or the API page changes.
            node:
              - 'bindings/node/**'
              - 'src/**'
              - 'build.rs'
              - 'Cargo.toml'
              - 'docs/**'
              - 'scripts/check_doc_node_examples.mjs'
              - '.github/workflows/ci.yml'
            # Same drift-gate rationale (#374): rebuild the Java binding when ITS
            # code OR the core it wraps changes. The JNI shim + Gradle/JUnit suite
            # (coverage-gated) run against the in-repo core.
            java:
              - 'bindings/java/**'
              - 'src/**'
              - 'build.rs'
              - 'Cargo.toml'
              - '.github/workflows/ci.yml'
            # The C-ABI substrate (safer-ffi) wraps the same core; drift-gate it too.
            cabi:
              - 'bindings/cabi/**'
              - 'src/**'
              - 'build.rs'
              - 'Cargo.toml'
              - '.github/workflows/ci.yml'


  # ── Lint and format (Linux only, code changes only) ─────────────
  lint:
    name: Lint & format
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2

      - name: Rust format
        run: cargo fmt --all -- --check

      - name: Rust clippy (pure core)
        # Default features = the pyo3-free crates.io core (#38/#42). --all-targets
        # so test and bench code is linted too (it rots otherwise).
        run: cargo clippy --all-targets --no-default-features -- -D warnings

      - name: Rust clippy (extension-module)
        # Lints the binding layer too, and catches genuinely-dead code that the
        # pure build's `cfg(not(extension-module))` dead_code allow would hide.
        run: cargo clippy --all-targets --features extension-module -- -D warnings

      - name: Allocation & space-cost lint gate
        # clippy with a curated allocation/clone/by-value lint set promoted to
        # deny (redundant_clone, or_fun_call, the pedantic alloc lints) — the
        # strongest "unnecessary allocation" lints that the default `-D warnings`
        # gate leaves off. Pure core only: the allocations live in the core; the
        # pyo3 extension layer is thin FFI glue whose owned-by-value signatures
        # are idiomatic (they'd trip needless_pass_by_value), same rationale as
        # the binding investigation in #457. Runtime heap profiling (dhat-rs) and
        # complexity (iai-callgrind, perf-gate.yml) are separate on-demand tools.
        run: bash scripts/perf_lint.sh

      - name: Pure core has no pyo3 (#38/#42 acceptance gate)
        # The default-feature crate is the pyo3-free crates.io core; assert the
        # default dependency tree carries no pyo3 (a leak would re-couple the pure
        # build to libpython). The extension lives behind `--features extension-module`.
        run: |
          if cargo tree -e no-dev | grep -qi pyo3; then
            echo "::error::pyo3 leaked into the default (pure) dependency tree"
            cargo tree -e no-dev | grep -i pyo3
            exit 1
          fi
          echo "OK: no pyo3 in the default dependency tree"
          # #208: logging is opt-in (`--features log`); the default build must
          # pull in NO `log` crate, so the shipped artifact pays zero cost.
          if cargo tree -e no-dev | grep -qiE '^\S*log v|[└├]── log v'; then
            echo "::error::log leaked into the default tree (#208: logging must be opt-in)"
            cargo tree -e no-dev | grep -i 'log v'
            exit 1
          fi
          echo "OK: no log in the default dependency tree"

      - name: Logging build + tests (#208, --features log / log-content)
        # The opt-in logging facade compiles under every feature combo, the hot
        # loops stay log-free (guard test), and default-level records carry no
        # content (redaction sentinel test).
        run: |
          cargo clippy --all-targets --no-default-features --features log -- -D warnings
          cargo build --no-default-features --features log-content
          cargo test --no-default-features --features log --test logging --test hot_path_guard

      - name: Cargo package — crates.io publish dry-run (#42)
        # Build the crate from a packaged tarball with the default (pure) feature
        # set, exactly as a `cargo add disarm` consumer receives it. Catches
        # missing files (readme/license), bad metadata, or pure-build breakage
        # before a release ever reaches crates.io.
        run: cargo package --no-default-features

      - name: Rust API semver check (#42, advisory)
        # The semver-governed Rust surface is `disarm::api` + the error types
        # (see docs/RUST_API.md). Advisory for now: the only prior crates.io
        # version is a 0.0.0 placeholder with no API to diff against. Once 0.10.0
        # is the published baseline this becomes a hard gate (drop continue-on-error).
        continue-on-error: true
        run: |
          cargo install cargo-semver-checks --locked || true
          cargo semver-checks check-release --default-features

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python lint tools
        run: pip install ruff==0.16.4 mypy

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy python/disarm --ignore-missing-imports


  # ── Test (Linux only, code changes only) ────────────────────────
  test:
    name: Test (ubuntu-latest, Python 3.12)
    needs: [changes, lint]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2

      - name: Rust tests
        run: cargo test --no-default-features

      - name: Cheap exhaustive targets (#658)
        # Three of the four `#[ignore]`d exhaustive targets are near-free, and
        # they cover the full BMP, every Hangul syllable, all CJK ideographs, 15
        # Indic blocks, grapheme-boundary integrity, and every Unicode scalar for
        # width bounds. Running them only at release meant a regression in any of
        # that surfaced on the release PR rather than on the one that caused it —
        # and the reason recorded for that placement was cost.
        #
        # `width_conformance` had it worse: it appeared in no workflow and in no
        # documented gate, so nothing had ever run it at all.
        #
        # Debug, not release, and deliberately so. The step above already built
        # this profile, so these binaries are compiled; the tests then take 0.62s
        # (0.06 + 0.32 + 0.24). In release they take 0.07s but need a whole second
        # build profile, which costs far more than the 0.55s it saves.
        #
        # One invocation with three `--test` flags rather than three invocations:
        # each `cargo test` repeats metadata resolution before running anything,
        # and #658 measured that dispatch at roughly 10s of `cargo test`'s 21.7s
        # warm wall across 23 process starts. Measured here, 0.70s -> 0.60s warm,
        # and the gap is wider on a cold runner.
        #
        # `exhaustive_confusables` stays in tier3.yml: 1.14s even in release, and
        # unlike these three it needs the release profile to stay that quick.
        run: |
          cargo test --no-default-features \
            --test exhaustive_transliterate \
            --test exhaustive_grapheme \
            --test width_conformance \
            -- --ignored

      - name: Install maturin
        run: pip install maturin[patchelf]

      - name: Build wheel and install
        # --release is load-bearing, not tidiness (#658). `maturin build` defaults
        # to the dev profile, and this job runs the whole Python suite against
        # whatever it produces: measured 129s on a debug wheel vs 17s on a release
        # one, same selection, same machine. The extra compile time is repaid many
        # times over by the test run, so do not drop the flag to speed up the build.
        run: |
          maturin build --release --out dist
          pip install dist/*.whl
          pip install ".[test]"
          pip install pytest-cov

      - name: Run tests
        run: pytest tests/ --ignore=tests/test_typing.py -m "not formal and not hypothesis" -q --tb=short --cov=disarm --cov-report=xml --cov-report=term-missing

      - name: Run doctests
        run: |
          DISARM_DIR=$(python -c "import disarm, os; print(os.path.dirname(disarm.__file__))")
          pytest --doctest-modules "$DISARM_DIR/__init__.py" "$DISARM_DIR/_compat.py" -q

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml


  # ── Cookbook doc-tests (#154: executable, asserted recipes) ─────
  # Runs on code OR docs changes: a doc example can break from a prose edit
  # or from an API change. Executes the allowlisted recipes in docs/conftest.py
  # against the built wheel, so a wrong/broken example turns CI red.
  doc-tests:
    name: Doc tests (Sybil)
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2

      - name: Install maturin
        run: pip install maturin[patchelf]

      - name: Build wheel and install
        run: |
          maturin build --release --out dist
          pip install dist/*.whl
          pip install ".[test]"

      - name: docs/index.md is in sync with its sources (#656)
        # It is generated from README.md + docs/_index_nav.md and carries a "do
        # not edit directly" banner. Nothing regenerated or verified it, and it
        # drifted in both directions: content only in the generated file that the
        # next run would delete, and content only in the sources that never
        # reached the site.
        #
        # This job is the right home rather than `test`: `test` is gated on the
        # `code` path filter, which does not include `**.md`, so a README-only
        # pull request would skip the check entirely. `doc-tests` runs on `docs`
        # too.
        run: bash scripts/generate_docs_index.sh --check

      - name: Anti-rot doc-claim lint (#156)
        run: python3 scripts/check_doc_claims.py

      - name: Run cookbook doc-tests (per-file isolated)
        run: python3 scripts/run_doc_tests.py

      # The Rust analogue of the Sybil gate: extract every ```rust doc block and
      # compile + run it against the pure core, with deny(unused_must_use) so an
      # example that discards its result fails. Catches signature/output drift in
      # the per-language usage tabs (#50). The job already sets up the rust
      # toolchain above; this step is its consumer.
      - name: Doc Rust examples (#50)
        run: python3 scripts/check_doc_rust_examples.py


  # ── Ruby binding, built against the LOCAL core (#374) ───────────
  # PR-time gate for the Ruby gem. The release workflow (publish-ruby.yml) builds
  # the binding against the PUBLISHED core; this job builds it against the
  # in-repo core, so an UNRELEASED core API change that breaks the gem fails here
  # — on the PR that introduces it — instead of silently at release (which is how
  # the 0.10.0 gem shipped broken, #364–#367). Runs on binding OR core changes.
  ruby:
    name: Ruby binding (Ruby ${{ matrix.ruby }})
    needs: changes
    if: needs.changes.outputs.ruby == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # magnus 0.7 supports 3.1-3.3, and all three are exercised — but not on
        # every PR push. A PR runs the FLOOR (3.1): a magnus/rb-sys incompatibility
        # shows up at the oldest supported version, not the newest, so one version
        # catches the realistic break for a third of the minutes. Pushes to main
        # run the full range, so nothing reaches a release unverified across it,
        # and publish-ruby.yml re-runs all three before the gem is built.
        ruby: ${{ github.event_name == 'pull_request' && fromJSON('["3.1"]') || fromJSON('["3.1","3.2","3.3"]') }}
    env:
      # bundler-cache runs at the repo root (no Gemfile there) unless pointed at
      # the gem's Gemfile; GITHUB_TOKEN authenticates the cargo-cache tooling.
      # (Mirrors publish-ruby.yml.)
      BUNDLE_GEMFILE: ${{ github.workspace }}/bindings/ruby/Gemfile
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Build the binding against the in-repo core (#374 drift gate)
        # The ext pins the core as a REGISTRY dep (version = "0.10") so the
        # cross-gem build — which mounts only the gem dir — stays self-contained.
        # Redirect that dep to the in-repo core for this CI build only, so an
        # unreleased core change is actually exercised. This patch is injected at
        # runtime and never committed: a relative-path patch would break the
        # cross-gem build, and gating it here keeps the release path on the
        # published core.
        run: printf '\n[patch.crates-io]\ndisarm = { path = "../.." }\n' >> bindings/ruby/Cargo.toml

      - uses: oxidize-rb/actions/setup-ruby-and-rust@e5f9a49a7812a078584072f6e3f657ad247c8771  # v1
        with:
          ruby-version: ${{ matrix.ruby }}
          rustup-toolchain: stable
          bundler-cache: true
          cargo-cache: true

      - name: Lint (RuboCop)
        working-directory: bindings/ruby
        run: bundle exec rubocop

      - name: Allocation lint gate (magnus glue, #456)
        # The binding Rust glue can degenerate and add an allocation regression
        # that is NOT in the core; lint it with the same ALLOC lints. The
        # [patch.crates-io] redirect above is in place, so it builds vs the in-repo
        # core. Runs from the repo root (the gem's toolchain may lack clippy).
        run: |
          rustup component add clippy
          BINDING=bindings/ruby bash scripts/perf_lint.sh

      - name: Compile + RSpec (against the local core)
        working-directory: bindings/ruby
        run: |
          bundle exec rake compile
          bundle exec rake spec

      - name: Doc Ruby examples against the local core (#50/#374)
        # The docs' Ruby `# =>` examples already run against the PUBLISHED gem in
        # publish-ruby.yml. Running them here too — against the freshly-built
        # LOCAL-core gem — extends the drift gate to documented output: a core
        # change that alters a documented Ruby result fails on its own PR. Runs
        # from the repo root so the script can reach docs/ and the built bundle.
        run: ruby scripts/check_doc_ruby_examples.rb


  # ── Node binding, built against the LOCAL core (#44 / #374) ─────
  # PR-time gate for the napi-rs binding. Mirrors the `ruby` job: the ext pins the
  # core as a REGISTRY dep, so a CI-only `[patch.crates-io]` redirect builds it
  # against the in-repo core, surfacing an unreleased core API change that would
  # break the addon on the PR that introduces it. Builds the native addon + the
  # TypeScript layer, then runs the vitest suite. Triggers on binding OR core changes.
  node:
    name: Node binding (Node ${{ matrix.node }})
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The shipped N-API 8 addon supports Node 14+ (package.json `engines`),
        # but the test runner does not: vitest 4 pulls vite 8, which requires Node
        # ^20.19 || >=22.12. So the suite runs on 20/22; the prebuilt addon is the
        # same ABI-stable binary Node 14–18 consumers load.
        node: ["20", "22"]
    defaults:
      run:
        working-directory: bindings/node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Build the binding against the in-repo core (#374 drift gate)
        # Never committed: a relative-path patch would break the napi prebuild
        # containers (which mount only this dir); gating it here keeps the release
        # path on the published core. Path is relative to bindings/node/Cargo.toml.
        run: printf '\n[patch.crates-io]\ndisarm = { path = "../.." }\n' >> Cargo.toml

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2
        with:
          workspaces: bindings/node

      - name: Allocation lint gate (napi glue, #456)
        # The binding Rust glue can degenerate and add an allocation regression
        # that is NOT in the core (a defensive clone, a redundant re-encode across
        # the FFI boundary). Lint it with the same ALLOC lints as the core. The
        # [patch.crates-io] redirect above is in place, so it builds vs the in-repo
        # core. Run from the repo root (the script and the binding path resolve there).
        working-directory: ${{ github.workspace }}
        run: BINDING=bindings/node bash scripts/perf_lint.sh

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: bindings/node/package-lock.json

      - run: npm ci

      - name: Lint (Biome)
        run: npm run lint

      - name: Build (napi addon + TypeScript) and test against the local core
        run: |
          npm run build:debug
          npm test

      - name: Doc Node examples against the local core (#44)
        # The docs' Node `// =>` examples (getting-started, the API page, the usage
        # tabs) run against the freshly-built LOCAL-core addon, so a core change
        # that alters a documented Node result fails on its own PR. Runs from the
        # repo root so the script can reach docs/ and the built addon.
        working-directory: ${{ github.workspace }}
        run: node scripts/check_doc_node_examples.mjs


  java:
    name: Java binding (JDK ${{ matrix.java }})
    needs: changes
    if: needs.changes.outputs.java == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 21 is the supported floor; the ABI-stable JNI lib loads on any 21+ JVM.
        java: ["21"]
    defaults:
      run:
        working-directory: bindings/java
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Build the JNI shim against the in-repo core (#374 drift gate)
        # Never committed (a relative-path patch would break release/packaging and
        # collide with this redirect). Path is relative to bindings/java/rust.
        working-directory: bindings/java/rust
        run: printf '\n[patch.crates-io]\ndisarm = { path = "../../.." }\n' >> Cargo.toml

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2
        with:
          workspaces: bindings/java/rust

      - name: Allocation lint gate (JNI glue)
        # Same ALLOC lints as the core, on the binding's Rust glue. The redirect
        # above is in place so it builds vs the in-repo core. Run from the repo root.
        working-directory: ${{ github.workspace }}
        run: BINDING=bindings/java/rust bash scripts/perf_lint.sh

      - uses: actions/setup-java@v5  # pin to a SHA on review (dependabot-managed)
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Build the native lib + run the coverage-gated suites against the local core
        # `check` runs both modules — disarm-java (JUnit) and disarm-kotlin (kotlin
        # .test) — plus their JaCoCo ≥90% line-coverage gates; the committed Gradle
        # wrapper builds the JNI cdylib (cargoBuild) against the local core.
        run: ./gradlew --no-daemon check


  cabi:
    name: C ABI (safer-ffi)
    needs: changes
    if: needs.changes.outputs.cabi == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/cabi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Build against the in-repo core (#374 drift gate)
        run: printf '\n[patch.crates-io]\ndisarm = { path = "../.." }\n' >> Cargo.toml

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2
        with:
          workspaces: bindings/cabi

      - name: Clippy (C-ABI glue)
        run: cargo clippy --all-targets -- -D warnings

      - name: Build the library and generate the C header
        run: |
          cargo build --release
          cargo test --features headers -- generate_headers

      - name: C header drift gate (#580)
        # The header IS the ABI contract. The smoke test below regenerates it and
        # compiles against it in the same breath, so a signature change plus a matching
        # call-site change is self-consistent and passes — that is how a 2-arg
        # disarm_normalize_confusables became 3-arg on #574 with every check green.
        # Diff the freshly generated header against the committed one so any ABI change
        # is a visible diff someone has to approve. Runs here because this job already
        # has the toolchain and the [patch.crates-io] redirect in place.
        run: |
          git diff --exit-code -- disarm.h || {
            echo "::error::bindings/cabi/disarm.h is out of date with the C ABI."
            echo "Regenerate it, then check the diff is ADDITIVE — widening an exported"
            echo "function breaks every linked caller; add an _opts variant instead."
            exit 1
          }

      - name: C smoke test — link the cdylib and exercise the ABI
        # Proves the header + ABI + ownership contract from C against the local core.
        run: |
          cc examples/smoke.c -I. -L target/release -ldisarm_ffi -o /tmp/disarm_smoke
          LD_LIBRARY_PATH="$PWD/target/release" /tmp/disarm_smoke


  # ── Security audit (#105: cargo audit for RustSec advisories) ──
  # Runs on every PR and weekly. Cargo.lock is not committed (it is .gitignored
  # for this library), so generate it before auditing.
  cargo-audit:
    name: Cargo audit (RustSec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

      - name: Generate Cargo.lock
        run: cargo generate-lockfile

      - name: Run cargo audit
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998  # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}


  # ── Supply-chain policy gate (#260: licenses, bans, sources via cargo-deny) ──
  # Runs on every PR (like cargo audit): a dependency's license or source can
  # change without any code change here. Cargo.lock is gitignored, so generate it
  # first; the policy lives in deny.toml.
  cargo-deny:
    name: Cargo deny (supply-chain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

      - name: Generate Cargo.lock
        run: cargo generate-lockfile

      - name: Run cargo deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25  # v2.1.1
        with:
          # licenses / bans / sources only — RustSec advisories are owned by the
          # dedicated `cargo audit` job above (#260).
          command: check licenses bans sources


  # ── Status gate (always runs, for branch protection) ────────────
  # ONE job, not one per language. GitHub bills every job rounded UP to the
  # nearest minute, so six aggregators that each finish in ~3 seconds were billed
  # as six full minutes per run — about a third of this workflow's billable time
  # spent on runner spin-up for jobs that only read `needs.*.result`.
  #
  # Collapsing them costs no signal: each language's verdict is still computed
  # from the same inputs and reported by name in the log, and any one failure
  # fails the gate. What changes is that branch protection now requires a single
  # `All checks passed` context instead of six.
  #
  # On a doc-only PR the language jobs are skipped and their gates pass — the
  # per-language `*_CHANGED` guards below preserve that exactly as before. The
  # RustSec audit and the supply-chain policy are the two exceptions that block
  # merge on EVERY PR (#195/#260): an advisory or a license change can land on a
  # dependency without any code change here.
  all-ok:
    name: All checks passed
    if: always()
    needs: [changes, lint, test, doc-tests, cargo-audit, cargo-deny, ruby, node, java, cabi]
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate every language gate
        run: |
          CODE="${{ needs.changes.outputs.code }}"
          DOCS="${{ needs.changes.outputs.docs }}"
          LINT="${{ needs.lint.result }}"
          TEST="${{ needs.test.result }}"
          DOCTESTS="${{ needs['doc-tests'].result }}"
          AUDIT="${{ needs['cargo-audit'].result }}"
          DENY="${{ needs['cargo-deny'].result }}"

          failed=0
          fail() { echo "::error title=$1::$2"; failed=1; }

          # ── Always-on gates ────────────────────────────────────────────────
          # An advisory or a supply-chain policy violation can appear without any
          # code change in this PR, so these block merge unconditionally.
          [[ "$AUDIT" == "success" ]] || fail "cargo audit" "RustSec advisory outstanding ($AUDIT)"
          [[ "$DENY"  == "success" ]] || fail "cargo deny"  "supply-chain policy violation ($DENY)"

          # ── Rust + Python ──────────────────────────────────────────────────
          if [[ "$CODE" == "true" || "$DOCS" == "true" ]]; then
            [[ "$DOCTESTS" == "success" ]] || fail "doc-tests" "cookbook doc-tests failed ($DOCTESTS)"
          fi
          if [[ "$CODE" == "true" ]]; then
            [[ "$LINT" == "success" ]] || fail "lint" "lint/format failed ($LINT)"
            [[ "$TEST" == "success" ]] || fail "test" "tests failed ($TEST)"
          else
            echo "No code changes — lint/test not required"
          fi

          # ── Bindings ───────────────────────────────────────────────────────
          # Each is required only when the binding or the core it wraps changed
          # (#374 drift gate); otherwise the job is skipped and the gate passes.
          check_binding() {
            local label="$1" changed="$2" result="$3"
            if [[ "$changed" != "true" ]]; then
              echo "$label: no binding/core changes — not required"
            elif [[ "$result" != "success" ]]; then
              fail "$label" "failed to build/test against the local core ($result)"
            else
              echo "$label: OK against the local core"
            fi
          }
          check_binding Ruby "${{ needs.changes.outputs.ruby }}" "${{ needs.ruby.result }}"
          check_binding Node "${{ needs.changes.outputs.node }}" "${{ needs.node.result }}"
          check_binding Java "${{ needs.changes.outputs.java }}" "${{ needs.java.result }}"
          check_binding "C ABI" "${{ needs.changes.outputs.cabi }}" "${{ needs.cabi.result }}"

          exit "$failed"
