name: Docs

# Build the MkDocs site in CI and deploy it to Cloudflare Pages (served at
# docs.disarm.dev). Push to main → production deploy; pull requests → preview
# deploy with the URL surfaced on the PR. Replaces the former Read the Docs
# trigger (#314). The build needs Python only — mkdocstrings parses the Python
# source statically (griffe), so no Rust/maturin is required here.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "python/disarm/**"
      - "requirements/docs.txt"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "python/disarm/**"
      - "requirements/docs.txt"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    name: Build and deploy docs (Cloudflare Pages)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    env:
      # A PR from Dependabot or a fork runs with a restricted token and NO repository
      # secrets, so the deploy below cannot authenticate and the whole job used to go
      # red — discarding the `mkdocs build --strict` result, which is the part that
      # actually gates doc quality and which runs fine there. A permanently-red check on
      # every dependency bump teaches people to ignore red.
      #
      # The `secrets` context is not available in a step-level `if:`, so surface
      # reachability here as a plain string and branch on `env` instead.
      HAS_CLOUDFLARE_CREDENTIALS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install docs dependencies
        # Hash-locked, compiled from the [docs] extra in pyproject.toml (the single
        # source of truth) — same pattern as requirements/bench.txt in perf-gate.yml.
        run: pip install --require-hashes -r requirements/docs.txt
      - name: Build site (strict)
        # --strict turns broken internal links / missing-nav pages into a failed
        # build, catching doc drift (same discipline as Sybil / check_doc_claims).
        run: mkdocs build --strict
      - name: Skip the deploy when credentials are unreachable
        if: env.HAS_CLOUDFLARE_CREDENTIALS != 'true'
        # Say so out loud. A silently-skipped deploy looks identical to a successful one
        # on the checks list, and the difference matters when you are waiting for a
        # preview URL that is never going to arrive.
        run: |
          echo "::notice title=Docs preview skipped::No Cloudflare credentials are \
          available to this run (Dependabot and fork pull requests do not receive \
          repository secrets). The site was still built with --strict, which is the \
          check that gates doc quality; only publishing the preview was skipped."

      - name: Deploy to Cloudflare Pages
        id: deploy
        if: env.HAS_CLOUDFLARE_CREDENTIALS == 'true'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0  # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # main → production (the project's production branch); PR → a named
          # preview deploy (pr-<n>) returning a unique *.pages.dev URL.
          command: >-
            pages deploy site
            --project-name=disarm-docs
            --branch=${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'main' }}
      - name: Surface preview URL on the PR
        if: >-
          env.HAS_CLOUDFLARE_CREDENTIALS == 'true'
          && github.event_name == 'pull_request'
          && steps.deploy.outputs.deployment-url != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const url = ${{ toJSON(steps.deploy.outputs.deployment-url) }};
            const marker = '<!-- docs-preview -->';
            const body = `${marker}\n📄 **Docs preview:** ${url}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.data.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
