[build-system]
requires = ["maturin>=1.14.0,<2"]
build-backend = "maturin"

[project]
name = "disarm"
version = "0.17.1"
description = "Unicode canonicalization and TR39 visual confusable analysis for Python: building blocks for text-security pipelines (homoglyph/bidi/zalgo/invisible-character handling) plus standards-based phonetic transliteration — powered by Rust"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Richard Quinn", email = "quinn.richard@gmail.com" },
]
keywords = [
    "unicode-security", "homoglyph", "confusable", "tr39", "idn",
    "anti-spoofing", "text-sanitization", "adversarial", "canonicalization",
    "bidi", "zalgo", "normalization", "security",
    "transliteration", "slug", "slugify", "unidecode", "romanization",
    "filename", "sanitize", "grapheme", "encoding", "CJK", "pinyin",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Typing :: Typed",
    "Topic :: Security",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Text Processing :: Filters",
    "Topic :: Text Processing :: General",
    "Topic :: Text Processing :: Indexing",
    "Topic :: Software Development :: Internationalization",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Natural Language :: English",
]

[project.optional-dependencies]
test = [
    "pytest>=9.1.0",
    "pytest-cov>=5.0",
    # Required: `addopts` runs `-n auto --dist loadfile`
    # (see docs/contributing/packaging.md#test-pytest-xdist).
    "pytest-xdist>=3.6",
    "hypothesis>=6.155.3",
    "mypy>=2.1.0",
    "sybil>=6",  # executable cookbook doc-tests (#154)
    # The workflow gates parse `.github/workflows/*.yml` (#830, #832; see
    # docs/contributing/packaging.md#test-pyyaml).
    "pyyaml>=6",
    # In `test`, not `dev`, and read from here by CI's changelog job (#993, #994, #985;
    # see docs/contributing/packaging.md#test-towncrier).
    "towncrier==26.9.0",
]
dev = [
    "disarm[test]",
    "ruff==0.16.8",
    "maturin>=1.14.0,<2",
    "pre-commit>=4.6.0",
]
bench = [
    # Exact pins only, so comparator ratios are reproducible (#234 gate V8; see
    # docs/contributing/packaging.md#bench-exact-pins).
    "pyperf==2.10.0",            # Python-side bench runner (tooling, not a comparator)
    # ── transliterate-axis comparators ──
    "Unidecode==1.4.0",
    "text-unidecode==1.3",
    "anyascii==0.3.3",
    # in-process pure-Python port; construct outside the measured region.
    "uroman==1.3.1.1",
    # ── normalize / security_clean axis comparator (NOT a transliterator; gate V16) ──
    "ftfy==6.3.1",              # must never appear in a transliterate-axis ratio
    # ── adversarial-defense axis comparator (visual mapping, like disarm) ──
    "decancer-py==0.4.1",       # the only comparator that also maps visually
    # ── slugify / filename axis comparators ──
    "python-slugify==9.0.0",
    "pathvalidate==3.3.1",
]
docs = [
    "mkdocs>=1.6",
    "mkdocstrings[python]>=1.0.4",
    "pymdown-extensions>=10.0",
]
# No context-mode extras: the ar/fa/he dictionaries are not in the wheel (#56, #60; see
# docs/contributing/packaging.md#no-context-mode-extras).

[project.scripts]
disarm = "disarm.__main__:main"

[project.urls]
Homepage = "https://disarm.dev"
Repository = "https://github.com/raeq/disarm"
Documentation = "https://docs.disarm.dev/"
Issues = "https://github.com/raeq/disarm/issues"
Changelog = "https://github.com/raeq/disarm/blob/main/CHANGELOG.md"

[tool.maturin]
python-source = "python"
module-name = "disarm._core"
# The crate default is now the pure Rust core (no pyo3); the Python extension
# must opt into the `extension-module` feature (which pulls in pyo3 + abi3-py310).
features = ["extension-module"]
# data/*.bin is not shipped in the wheel
# (see docs/contributing/packaging.md#dictionary-data-files).

[tool.pytest.ini_options]
# Doc-tests are not collected here: `python scripts/run_doc_tests.py` runs them
# (see docs/contributing/packaging.md#testpaths).
testpaths = ["tests"]
# Lets tests import the repo-root `benchmarks` package from an installed wheel
# (see docs/contributing/packaging.md#pythonpath).
pythonpath = ["."]
# CI's selection minus `slow`; `-n 0` for one file or a debugger; CI's own `-m` must
# also say `not serial` (#658, #997; see docs/contributing/packaging.md#addopts).
addopts = [
    "-v",
    "--tb=short",
    "-n",
    "auto",
    "--dist",
    "loadfile",
    "-m",
    "not formal and not hypothesis and not slow and not serial",
]
markers = [
    # `slow` is opt-in since #658 (see docs/contributing/packaging.md#markers).
    "slow: expensive, opt-in - run with 'pytest -m slow' (see #658)",
    "formal: exhaustive formal invariant tests — run before release with 'pytest -m formal'",
    "hypothesis: property-based / fuzz tests using Hypothesis — expensive, run locally not in CI",
    "serial: measures wall-clock parallelism, so cannot share the box with xdist workers — deselected by default; CI runs it with 'pytest -m serial -n 0'",
]

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"
# The binding-parity seeder + live checker are compact, standalone tooling scripts
# kept as-authored; exempt them from lint/format rather than expand their dense style.
extend-exclude = ["scripts/parity.py", "scripts/parity_check.py", "scripts/parity_runtime.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",   # line too long — handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["disarm"]

[tool.pyright]
pythonVersion = "3.10"
pythonPlatform = "All"
typeCheckingMode = "strict"
include = ["python"]
reportMissingModuleSource = false

# --- Changelog fragments (#993) ---------------------------------------------
# `changelog.d/` is assembled into CHANGELOG.md at release
# (see docs/contributing/packaging.md#why-fragments).
[tool.towncrier]
directory = "changelog.d"
template = "changelog.d/_template.md"
filename = "CHANGELOG.md"
# Matches the existing headers, em dash included: `## [0.16.0] — 2026-09-06`.
title_format = "## [{version}] — {project_date}"
start_string = "<!-- towncrier release notes start -->\n"
underlines = ["", "", ""]
# Entries already carry their issue and PR numbers inline in the bold lead
# (`**Thing (#990).**`), so towncrier must not append a second reference.
issue_format = ""
# Fragments are written exactly as they ship; never re-wrap them
# (see docs/contributing/packaging.md#wrapping).
wrap = false
all_bullets = false
# A fragment with no PR number yet — the first push of a branch — is `+slug.type.md`.
orphan_prefix = "+"
# A fragment is named for the PULL REQUEST, not the issue
# (see docs/contributing/packaging.md#fragment-names).

# Heading order, pinned to the latest release's by tests/test_changelog_fragments.py
# (see docs/contributing/packaging.md#type-order).
[[tool.towncrier.type]]
directory = "upgrade"
name = "Upgrade notes"
showcontent = true

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "breaking"
name = "Changed (breaking)"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "security"
name = "Security"
showcontent = true

[[tool.towncrier.type]]
directory = "performance"
name = "Performance"
showcontent = true

[[tool.towncrier.type]]
directory = "docs"
name = "Documentation"
showcontent = true

[[tool.towncrier.type]]
directory = "internal"
name = "Internal"
showcontent = true
