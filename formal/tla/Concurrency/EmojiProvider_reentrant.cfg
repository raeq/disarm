\* Real code, ONE thread: set_emoji_provider replaces a provider whose __del__
\* calls set_emoji_provider or demojize. Expected: FAIL (self-deadlock).
\* Repro r1a / r1b.
SPECIFICATION Spec
CONSTANTS
    defaultInitValue = defaultInitValue
    Threads = {1}
    Setters = {1}
    ReaderCalls = 0
    ReaderText = {"plain"}
    DelBehaviours = {"reenter_set", "reenter_demojize"}
    LookupReenters = FALSE
    WriterPref = TRUE
    Fixed = FALSE
    MaxDepth = 1
INVARIANTS TypeOK
CHECK_DEADLOCK TRUE
