\* Real code, TWO threads, no re-entrancy into disarm: the replaced provider's
\* __del__ only releases the GIL (blocking I/O); another thread calls demojize.
\* Expected: FAIL (GIL <-> GLOBAL_PROVIDER deadlock). Repro r2.
SPECIFICATION Spec
CONSTANTS
    defaultInitValue = defaultInitValue
    Threads = {1, 2}
    Setters = {1}
    ReaderCalls = 2
    ReaderText = {"plain", "emoji"}
    DelBehaviours = {"release_gil"}
    LookupReenters = FALSE
    WriterPref = TRUE
    Fixed = FALSE
    MaxDepth = 1
CHECK_DEADLOCK TRUE
