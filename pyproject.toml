[build-system]
requires = ["maturin>=1.14.0,<2"]
build-backend = "maturin"

[project]
name = "disarm"
version = "0.14.1"
description = "Unicode canonicalization and TR39 visual confusable analysis for Python: building blocks for text-security pipelines (homoglyph/bidi/zalgo/invisible-character handling) plus standards-based phonetic transliteration — powered by Rust"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Richard Quinn", email = "quinn.richard@gmail.com" },
]
keywords = [
    "unicode-security", "homoglyph", "confusable", "tr39", "idn",
    "anti-spoofing", "text-sanitization", "adversarial", "canonicalization",
    "bidi", "zalgo", "normalization", "security",
    "transliteration", "slug", "slugify", "unidecode", "romanization",
    "filename", "sanitize", "grapheme", "encoding", "CJK", "pinyin",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Typing :: Typed",
    "Topic :: Security",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Text Processing :: Filters",
    "Topic :: Text Processing :: General",
    "Topic :: Text Processing :: Indexing",
    "Topic :: Software Development :: Internationalization",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Natural Language :: English",
]

[project.optional-dependencies]
test = [
    "pytest>=9.1.0",
    "pytest-cov>=5.0",
    # `pytest -n 2 --dist loadfile` (#658). `--dist loadfile` is not optional:
    # `register_lang` mutates process-global state that cannot be undone, so
    # tests have to stay grouped by file, which per-file distribution preserves.
    #
    # `-n 2`, not `-n auto`. Measured after the #658 fixes: serial 6.1s, -n 2
    # 4.9s, -n 4 5.0s, -n auto 5.4s — once the suite is this short, worker
    # startup dominates and `auto` over-provisions. CI stays serial for the same
    # reason; ~1s does not pay for installing the plugin there.
    "pytest-xdist>=3.6",
    "hypothesis>=6.155.3",
    "mypy>=2.1.0",
    "sybil>=6",  # executable cookbook doc-tests (#154)
    # The workflow gates (#830, #832) read `.github/workflows/*.yml`, and pattern-
    # matching them is what produced the bug review caught: an `on: push` written
    # inline read as "not a push workflow" and was silently exempted. Parsing needs
    # a YAML reader, and `on` being a YAML 1.1 boolean is not a thing to hand-roll.
    "pyyaml>=6",
]
dev = [
    "disarm[test]",
    "ruff==0.16.5",
    "maturin>=1.14.0,<2",
    "pre-commit>=4.6.0",
]
bench = [
    # Exact-pinned so cross-run comparator ratios are reproducible (#234 gate V8).
    # No `>=` permitted here: a floating comparator silently shifts every ratio's
    # denominator. The hash-locked lockfile (gate V7) pins transitive deps + wheels;
    # these `==` lines pin the declared intent. Versions are PyPI-current stable.
    "pyperf==2.10.0",            # Python-side bench runner (tooling, not a comparator)
    # ── transliterate-axis comparators ──
    "Unidecode==1.4.0",
    "text-unidecode==1.3",
    "anyascii==0.3.3",
    # in-process pure-Python port; construct outside the measured region.
    # (marker no longer needed: requires-python is >=3.10 since #277 lever 1)
    "uroman==1.3.1.1",
    # ── normalize / security_clean axis comparator (NOT a transliterator; gate V16) ──
    "ftfy==6.3.1",              # must never appear in a transliterate-axis ratio
    # ── adversarial-defense axis comparator (visual mapping, like disarm) ──
    "decancer-py==0.4.1",       # the only comparator that also maps visually
    # ── slugify / filename axis comparators ──
    "python-slugify==8.0.4",
    "pathvalidate==3.3.1",
]
docs = [
    "mkdocs>=1.6",
    "mkdocstrings[python]>=1.0.4",
    "pymdown-extensions>=10.0",
]
# NOTE: context-aware transliteration (transliterate(context=True), ar/fa/he) is
# NOT pip-installable. The dictionaries are large (~37 MB) and are not shipped in
# the wheel. There used to be empty `arabic`/`hebrew`/`context` extras here; they
# did nothing (installing them added no dictionaries), so they were removed (#56).
# To enable context mode: build the dictionaries from a source checkout with
#   bash scripts/bootstrap_dicts.sh
# and point the DISARM_DICT_DIR environment variable at the output directory.
# (Tracked for a proper packaged distribution — see issues #56/#60.)

[project.scripts]
disarm = "disarm.__main__:main"

[project.urls]
Homepage = "https://disarm.dev"
Repository = "https://github.com/raeq/disarm"
Documentation = "https://docs.disarm.dev/"
Issues = "https://github.com/raeq/disarm/issues"
Changelog = "https://github.com/raeq/disarm/blob/main/CHANGELOG.md"

[tool.maturin]
python-source = "python"
module-name = "disarm._core"
# The crate default is now the pure Rust core (no pyo3); the Python extension
# must opt into the `extension-module` feature (which pulls in pyo3 + abi3-py310).
features = ["extension-module"]
# Context dictionary data files (data/*.bin) are NOT shipped in the wheel. They
# are built from source via `bash scripts/bootstrap_dicts.sh` and located at
# runtime via the DISARM_DICT_DIR environment variable (see src/context.rs).
# For a self-contained build, compile with the `embed-dicts` Cargo feature.

[tool.pytest.ini_options]
# Cookbook doc-tests live under docs/ and run as a separate invocation
# (`pytest docs/`, see CONTRIBUTING.md). They are deliberately NOT in testpaths:
# docs/conftest.py would otherwise shadow tests/conftest.py, which the suite
# imports shared fixtures from via `from conftest import ...`.
testpaths = ["tests"]
# Put the repo root on sys.path so tests can import the out-of-CI `benchmarks`
# package (e.g. tests/test_adversarial_eval.py). Needed when disarm is
# installed from a wheel rather than editable — as in CI — where the repo root
# is not otherwise importable.
pythonpath = ["."]
# Bare `pytest` runs CI's selection minus the opt-in `slow` tier (#658). CI uses
# `-m "not formal and not hypothesis"`, so the two expressions differ by
# `not slow` — but nothing in that tier executes under CI conditions anyway:
# `test_cabi_header_drift` skips when $CI is set, and the ratio floors need the
# `bench` extra, which CI does not install. Measured with CI=1 and no bench
# extra: 5 selected, 5 skipped. The *executed* set matches; the *expression*
# does not.
#
# The Hypothesis tier was in the local default and in no CI job at all, so a
# contributor paid ~67s on every run for a tier `nightly-hypothesis.yml` already
# runs at 03:17 UTC with a random seed and a 10x oracle budget — a better
# exercise of it than one more fixed-seed pass. `pytest -m hypothesis` on demand.
addopts = ["-v", "--tb=short", "-m", "not formal and not hypothesis and not slow"]
markers = [
    # Opt-in since #658: the marker described itself as deselectable and nothing
    # deselected it, so it had no effect. Both things it covers are gated
    # elsewhere — `test_cabi_header_drift` mirrors the `cabi` CI job and costs a
    # cold cargo build (~25s) on the first run after a Rust change, and
    # `test_performance_claims`' ratio floors need the pinned comparators from
    # the `bench` extra and skip without them. Run with `pytest -m slow`.
    "slow: expensive, opt-in - run with 'pytest -m slow' (see #658)",
    "formal: exhaustive formal invariant tests — run before release with 'pytest -m formal'",
    "hypothesis: property-based / fuzz tests using Hypothesis — expensive, run locally not in CI",
]

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"
# The binding-parity seeder + live checker are compact, standalone tooling scripts
# kept as-authored; exempt them from lint/format rather than expand their dense style.
extend-exclude = ["scripts/parity.py", "scripts/parity_check.py", "scripts/parity_runtime.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",   # line too long — handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["disarm"]

[tool.pyright]
pythonVersion = "3.10"
pythonPlatform = "All"
typeCheckingMode = "strict"
include = ["python"]
reportMissingModuleSource = false
