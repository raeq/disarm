name = "presets"
version = "0.1.0"
defaultTargets = ["Presets", "difftest"]

[[lean_lib]]
name = "Presets"
# `native_decide` in Bounded.lean evaluates the model over hundreds of thousands of
# words; precompiling makes that native code instead of the IR interpreter.
precompileModules = true

[[lean_exe]]
name = "difftest"
root = "Main"
