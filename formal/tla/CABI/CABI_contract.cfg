SPECIFICATION Spec
\* The code as written, with a client that keeps the unwritten half of the contract:
\* non-NULL, valid UTF-8 arguments, and returned strings treated as read-only.
CONSTANTS
    MaxCalls = 3
    Inputs = {"valid"}
    ClientWrites = FALSE
    Fixed = FALSE
INVARIANTS TypeOK NoNullArgUB NoInvalidUtf8UB NoWriteToStatic NoLayoutMismatch NoDoubleFree ResultExclusive NoLeak
