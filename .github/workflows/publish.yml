name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PACKAGE_NAME: disarm

jobs:
  # ── Tier 3 release gate (#159, epic #326) ───────────────────────
  # The exhaustive + formal pre-publish regimen, defined in the reusable workflow
  # .github/workflows/tier3.yml and called from HERE ONLY. Every build job
  # `needs:` this, and so do `publish` / `publish-crate`, so a Tier-3 failure
  # blocks the upload to PyPI and crates.io (no wheels are even built).
  #
  # It runs HERE AND NOWHERE ELSE. The binding publishers used to call the same
  # reusable workflow, described as gating "on the SAME reusable workflow" — true of
  # the definition, false of the execution: `uses:` instantiates a fresh job per
  # caller, so that was four independent runs of a suite containing proptests, which
  # draw random inputs. Four stochastic gates on one artifact are atomic only by
  # luck. The bindings inherit this gate transitively instead: each waits for the
  # core on crates.io, and the core cannot get there unless this job passed.
  tier3:
    name: Tier 3 (exhaustive + formal)
    uses: ./.github/workflows/tier3.yml

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    needs: tier3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist-sdist
          path: dist/*.tar.gz

  build-wheels-linux:
    name: Build wheels (Linux ${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: tier3
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1
        with:
          target: ${{ matrix.target }}
          # Pin the interpreter to 3.10 so maturin builds a single abi3 wheel
          # (cp310-abi3). Without this, maturin enumerates every interpreter in
          # the manylinux container — including interpreters below the
          # abi3-py310 floor — and emits version-specific wheels instead of
          # cp310-abi3 (see issue #26). abi3-py310 wheels are forward-compatible
          # with all CPython >= 3.10 (#277 lever 1: fastcall + AsUTF8AndSize).
          args: --release --out dist --interpreter 3.10
          manylinux: auto
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist-linux-${{ matrix.target }}
          path: dist/*.whl

  build-wheels-macos:
    name: Build wheels (macOS ${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    needs: tier3
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            runner: macos-14
          - target: aarch64-apple-darwin
            runner: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist-macos-${{ matrix.target }}
          path: dist/*.whl

  build-wheels-windows:
    name: Build wheels (Windows)
    runs-on: windows-latest
    needs: tier3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1
        with:
          args: --release --out dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist-windows
          path: dist/*.whl

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    # Depend on tier3 explicitly (belt-and-braces) as well as on the builds:
    # the builds already `needs: tier3`, but naming it here makes the gate
    # self-evident and survives any future build-job restructuring (#159).
    needs: [tier3, build-sdist, build-wheels-linux, build-wheels-macos, build-wheels-windows]
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/
      - name: List built artifacts
        run: ls -lh dist/
      - name: Verify Linux wheels are abi3 (guard against regression of #26)
        run: |
          # abi3 wheels are tagged cpXY-abi3 (the abi3 floor — cp310-abi3 since
          # #277/#284 raised it from cp39); a version-specific CPython Linux wheel
          # (e.g. cp38-cp38, cp39-cp39) means the abi3 build was bypassed (#26).
          # The check is floor-agnostic (cp3[0-9]+-abi3) so a future floor bump
          # does not silently re-introduce this stale-guard failure.
          # find -printf rather than `ls | grep` (shellcheck SC2010): same names,
          # one per line, without parsing ls output.
          bad=$(find dist -maxdepth 1 -type f -printf '%f\n' | grep -E 'cp3[0-9]+-cp3[0-9]+.*(manylinux|linux)' || true)
          if [ -n "$bad" ]; then
            echo "::error::Found version-specific (non-abi3) CPython Linux wheel(s):"
            echo "$bad"
            exit 1
          fi
          if ! find dist -maxdepth 1 -type f -printf '%f\n' | grep -qE 'cp3[0-9]+-abi3-manylinux.*x86_64'; then
            echo "::error::Missing expected cp3XX-abi3 manylinux x86_64 wheel."
            exit 1
          fi
          echo "OK: Linux wheels are abi3 (cp3XX-abi3), no version-specific CPython wheels."
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
        with:
          skip-existing: true
          # PEP 740 provenance: generate + upload a signed attestation for every
          # distribution, binding it to this repo + workflow + commit via the
          # OIDC trusted-publishing identity (#260). Default-on, set explicitly.
          attestations: true

  # ── crates.io: verify in one job, publish from another ─────────────
  # Verifying a crate builds it, and building it runs the build script and
  # proc-macros of every dependency — resolved fresh at release time, since
  # Cargo.lock is not committed. That code used to run in the job, and in the
  # step, that held the registry token. It now runs here, with no secret and no
  # cache, and `publish-crate` below builds nothing.
  verify-crate:
    name: Verify crate package
    runs-on: ubuntu-latest
    needs: tier3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

      - name: Verify the pure package (no pyo3 / libpython)
        # `cargo package` builds the packaged tarball exactly as `cargo publish`
        # would verify it, so the publish job can skip that build.
        run: |
          cargo package --no-default-features
          if cargo tree -e no-dev | grep -qi pyo3; then
            echo "::error::pyo3 leaked into the default tree — refusing to publish"
            exit 1
          fi

  publish-crate:
    name: Publish crate to crates.io
    runs-on: ubuntu-latest
    # Same Tier-3 release gate as the PyPI path (#159): no publish if the
    # exhaustive/formal suites fail. Publishes the pure default crate — the
    # `disarm::api` surface (#42) — independently of the Python wheels.
    needs: [tier3, verify-crate]
    # Mirror the PyPI job's `environment:` so crates.io publishing can carry the
    # same Environment protections (required reviewers, branch limits). The token
    # is a plain repo secret (CRATES_IO_API_TOKEN_001), which is readable from an
    # environment-scoped job, so this needs no per-environment secret setup.
    environment: crates-io
    # `id-token: write` is for crates.io trusted publishing (the auth step below).
    permissions:
      contents: read
      id-token: write
    steps:
      # No build cache: a restored target/ can carry compiled build scripts, and
      # this job holds a registry credential.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

      # Trusted publishing, ready for the day it is configured on crates.io
      # (docs/security/supply-chain.md). Until then crates.io refuses the exchange,
      # this step fails without failing the job, and the publish below falls back
      # to the long-lived token. Once the Trusted Publisher exists and the
      # CRATES_IO_API_TOKEN_001 secret is deleted, the fallback is empty and a
      # failed exchange fails the publish, which is the direction to fail in.
      - name: Exchange the OIDC token for a short-lived crates.io token
        id: crates-io-auth
        continue-on-error: true
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18  # v1.0.5

      - name: Publish to crates.io
        # `cargo publish` reads the registry token from CARGO_REGISTRY_TOKEN: the
        # trusted-publishing token when the step above got one, else the repo
        # action secret CRATES_IO_API_TOKEN_001.
        # `--no-verify`: verify-crate above built this exact package; building it
        # again here would run every dependency's build script beside the token.
        # `--no-default-features` matches that verification (`default = []`, the
        # pure pyo3-free core). One publish per version; a re-run of an already
        # published version fails by design.
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token || secrets.CRATES_IO_API_TOKEN_001 }}
        run: cargo publish --no-default-features --no-verify

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    # Attach the bill of materials to the GitHub Release (not on manual dispatch,
    # which has no release to attach to).
    if: github.event_name == 'release'
    # Read-only: this job compiles cargo-cyclonedx and its dependencies. Attaching
    # the result to the release needs `contents: write`, which `sbom-attach` holds
    # and uses for one `gh` call.
    steps:
      # SHA-pin every action in the provenance path (a supply-chain job must not
      # trust mutable tags) and pin the SBOM generator version for reproducible,
      # non-breaking release output. No build cache: this output ships.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
      - name: Generate Cargo.lock
        run: cargo generate-lockfile
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked --version 0.5.9
      - name: Generate Rust SBOM (CycloneDX)
        run: cargo cyclonedx --format json --all-features
      - name: Collect SBOM artifact(s)
        run: |
          mkdir -p sbom
          find . -name '*.cdx.json' -not -path './sbom/*' -exec cp {} sbom/ \;
          ls -lh sbom/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom-cyclonedx
          path: sbom/*.cdx.json

  sbom-attach:
    name: Attach SBOM to the release
    runs-on: ubuntu-latest
    needs: sbom
    if: github.event_name == 'release'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: sbom-cyclonedx
          path: sbom
      - name: Attach SBOM to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # There is no checkout in this job, so `gh` is told the repository.
          GH_REPO: ${{ github.repository }}
          # Through the environment, not spliced into the script, so a tag is data.
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" sbom/*.cdx.json --clobber
