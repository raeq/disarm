name: Ruby gem (#45)

# Build + test the Ruby binding on PRs that touch it; build precompiled platform
# gems and push them to RubyGems on a GitHub release. The native ext wraps the
# pure-Rust core (no Python), so the platform gems install with no Rust toolchain.
on:
  # Only `main` on push — a PR branch is already covered by `pull_request`, and
  # firing both for the same commit spawns two concurrent runs that race on the
  # identical rb-sys/bundler cache keys ("Unable to reserve cache … another job
  # may be creating this cache"), flaking the job. Post-merge `main` pushes still
  # re-validate.
  push:
    branches: [main]
    paths: ["bindings/ruby/**", "docs/**", "scripts/check_doc_ruby_examples.rb", ".github/workflows/publish-ruby.yml"]
  pull_request:
    # `docs/**` used to be here so the Ruby `# =>` doc examples (#50) re-validated
    # when a usage tab changed. That fired this whole gem pipeline on every docs
    # PR — 32 times in one 48-hour window, ~4.7 billed minutes each — to run a
    # check ci.yml's `ruby` job can do in one, and it tested the PUBLISHED core
    # rather than the PR's, so it could not catch core drift anyway.
    #
    # ci.yml's ruby filter now carries `docs/**` and the doc-example script, so
    # that gate still runs on every docs PR — once, and against the local core.
    # What remains here is the question only this workflow answers: does the gem
    # build and pass against the PUBLISHED core? That is a release concern, so it
    # runs on push to main and on release, plus PRs touching the binding or this
    # workflow.
    paths: ["bindings/ruby/**", ".github/workflows/publish-ruby.yml"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (Ruby ${{ matrix.ruby }})
    # On release/dispatch this job compiles the ext against the PUBLISHED core (the
    # #374 patch is skipped), so it must wait for the core like `cross-gems` already
    # does — v0.12.0 hit exactly this: `test` raced the core publish and died at
    # `rake compile` ("failed to select a version for `disarm = ^0.12`"). Skip-safe
    # `if:` so a skipped gate (push/PR, #374 patch path) still runs the tests.
    needs: wait-for-core
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.1", "3.2", "3.3", "3.4", "4.0"]
    # bundler-cache in the setup action runs at the repo root, which has no
    # Gemfile — point bundler at the gem's Gemfile everywhere. GITHUB_TOKEN
    # authenticates the cargo-cache cleanup's cargo-binstall fetch, which
    # otherwise fails the job (exit 94, "Failed to retrieve token from gh auth
    # token") when it hits GitHub's unauthenticated API rate limit.
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/bindings/ruby/Gemfile
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        working-directory: bindings/ruby
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Build against the in-repo core on non-publish events (#374 drift gate)
        # On a PR or a push to main, the PUBLISHED core can lag the binding: a
        # pre-release binding may call a core API that isn't on crates.io yet (e.g.
        # has_anomalies before 0.11), so a published-core build fails to compile —
        # the binding is red until the matching core ships. Redirect the registry
        # dep to the in-repo core for these VALIDATION builds, exactly as ci.yml's
        # `ruby` job does, so the binding is exercised against the core it actually
        # targets. On release / workflow_dispatch (the real publish) we DON'T patch,
        # so the shipped gem and its smoke test build against the PUBLISHED core.
        # Appended to the gem-root workspace manifest; injected at runtime, never
        # committed (a committed relative-path patch would break the cross-gem build).
        if: github.event_name != 'release' && github.event_name != 'workflow_dispatch'
        # This job is ubuntu-only today, but force bash so the append is host-agnostic
        # if a runner is ever added (mirrors the Windows-safe step in publish-node.yml).
        shell: bash
        run: printf '\n[patch.crates-io]\ndisarm = { path = "../.." }\n' >> Cargo.toml

      - uses: oxidize-rb/actions/setup-ruby-and-rust@e5f9a49a7812a078584072f6e3f657ad247c8771 # v1
        with:
          ruby-version: ${{ matrix.ruby }}
          rustup-toolchain: stable
          bundler-cache: true
          cargo-cache: true
      - run: bundle exec rake compile
      - run: bundle exec rake spec
      # Verify the docs' Ruby `# =>` examples against the freshly-built binding
      # (#50). Run from the repo root so the script can reach docs/ and the gem.
      - name: Doc Ruby examples (#50)
        working-directory: ${{ github.workspace }}
        run: ruby scripts/check_doc_ruby_examples.rb

  # ── Wait for the published core on crates.io (#500 release race) ──
  # On `release: published`, this publisher fires in parallel with publish.yml
  # (core → crates.io), but the cross-gem build resolves `disarm_core` as a
  # REGISTRY dependency with NO [patch.crates-io] redirect (the #374 patch step in
  # the `test` job runs ONLY on non-publish events). publish.yml pushes `disarm` to
  # crates.io only after its Tier-3 gate + multi-platform wheels (several minutes),
  # so an un-gated build starts first and dies with "failed to select a version for
  # the requirement `disarm = ^0.<minor>`". Gate the cross-gem build on this single
  # upstream job (issue #500 option 3, scoped within this workflow so the OIDC
  # Trusted Publisher filename is preserved) instead of polling once per matrix leg.
  wait-for-core:
    name: Wait for the published core
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Poll the crates.io sparse index for the target core version
        # This job has no working-directory default, so the manifest is referenced
        # by full path — the extension crate's, not the gem-root workspace.
        shell: bash
        run: |
          req="$(sed -nE 's/.*package = "disarm", version = "([0-9]+\.[0-9]+)".*/\1/p' bindings/ruby/ext/disarm/Cargo.toml | head -n1)"
          if [ -z "$req" ]; then echo "::error::could not parse disarm_core version from bindings/ruby/ext/disarm/Cargo.toml"; exit 1; fi
          esc="${req//./\\.}"
          echo "Waiting for a non-yanked disarm $req.* on the crates.io sparse index…"
          deadline=$((SECONDS + 600))
          until curl -sf https://index.crates.io/di/sa/disarm | jq -r 'select(.yanked==false) | .vers' | grep -qE "^${esc}\.[0-9]+$"; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::disarm $req.* did not appear on crates.io within 10 minutes"; exit 1
            fi
            echo "  not yet; retrying in 15s…"; sleep 15
          done
          echo "disarm $req.* is available on crates.io."

      # #830: the poll above proves a 0.MINOR.* EXISTS on crates.io. It does not prove
      # the glue AT THIS REF can build against it, and between releases it usually
      # cannot — a core API and the glue that uses it land in one commit, so every ref
      # after that needs an unreleased core until the next release moves the pin.
      #
      # On `release:` that is fine: publish.yml has just pushed the matching core, and
      # the poll above is what waits for it. The case this catches is a
      # `workflow_dispatch:` on main — the per-registry patch lane RELEASING.md
      # documents — which resolves the OLD published core and used to die deep in a
      # per-platform matrix with a bare E0425/E0609 rather than here, with a reason.
      - uses: oxidize-rb/actions/setup-ruby-and-rust@e5f9a49a7812a078584072f6e3f657ad247c8771 # v1
        with:
          ruby-version: "3.3"
          # NOT `bundler-cache: true`. It runs at the repo root, which has no Gemfile —
          # the note at the top of `test` explains why every other job here sets
          # `BUNDLE_GEMFILE`, and this job does not. It does not need to: the check below
          # is `cargo check`, which wants Ruby's headers for rb-sys and no gem bundle at
          # all. Enabling the cache here would fail the gate before it reached the check
          # it exists to run.
          bundler-cache: false
      - name: The published core must be one this glue compiles against (#830)
        shell: bash
        working-directory: bindings/ruby/ext/disarm
        run: |
          set -uo pipefail
          # No [patch.crates-io] redirect: `build` applies that only on non-publish
          # events (#374), so this resolves exactly what the publish build will.
          if cargo check --quiet 2>/tmp/core-check.log; then
            echo "The published core builds this glue."
            exit 0
          fi
          echo "::error title=Glue needs an unreleased core::The glue at this ref uses core API that the published disarm does not have, so this build cannot succeed."
          echo
          echo "First errors:"
          grep -E '^error(\[|:)' /tmp/core-check.log | head -5 || tail -20 /tmp/core-check.log
          echo
          echo "Two ways forward, per RELEASING.md 'Across languages' rule 2:"
          echo "  * dispatch this workflow on a RELEASE TAG whose glue and core were published together; or"
          echo "  * release the core first, so the pin and the published version move together."
          exit 1

  cross-gems:
    name: Build gem (${{ matrix.platform }})
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    # Gate on the core landing on crates.io (#500) — the cross-gem build resolves
    # `disarm_core` from the registry unpatched on this path.
    needs: wait-for-core
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - x86_64-linux
          - aarch64-linux
          - x86_64-darwin
          - arm64-darwin
          - x64-mingw-ucrt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: oxidize-rb/actions/setup-ruby-and-rust@e5f9a49a7812a078584072f6e3f657ad247c8771 # v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - uses: oxidize-rb/actions/cross-gem@e5f9a49a7812a078584072f6e3f657ad247c8771 # v1
        with:
          platform: ${{ matrix.platform }}
          # Every ABI the gem claims support for must be built (#699). A version
          # missing here is not a degraded install — it is no install at all, because
          # `lib/disarm.rb` requires `disarm/<RUBY_VERSION>/disarm` and a platform gem
          # carries only the ABIs listed here. 3.4 shipped 2024-12 and 4.0 2025-12;
          # both were locked out across six disarm releases.
          ruby-versions: "3.1,3.2,3.3,3.4,4.0"
          working-directory: bindings/ruby
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: cross-gem-${{ matrix.platform }}
          path: bindings/ruby/pkg/*.gem

  # The fallback that turns a missing ABI into a local compile rather than a
  # resolution failure (#699). Every version from 0.10.0 to 0.14.1 shipped
  # precompiled-only — 35 platform gems, zero `ruby`-platform gems — so a Ruby the
  # cross-build did not cover had nowhere to go. The push loop below has always
  # handled a source gem (it sets `platform=ruby` when the filename parse yields no
  # suffix); that branch had simply never been reached, because `cross-gems` was the
  # only job producing artifacts.
  source-gem:
    name: Build source gem
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs: wait-for-core
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/bindings/ruby/Gemfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: oxidize-rb/actions/setup-ruby-and-rust@e5f9a49a7812a078584072f6e3f657ad247c8771 # v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      # `gem build`, not `rake build`: the Rakefile makes `build` depend on `compile`
      # (a local convenience), and compiling here would be several minutes of work
      # whose output the gemspec does not package anyway — `spec.files` globs
      # `lib/**/*.rb`, not `.bundle`. Verified: the resulting gem is `platform: ruby`
      # with zero compiled artifacts, carrying `extconf.rb` and the Rust sources so
      # RubyGems compiles it on install.
      - name: Build the source gem
        working-directory: bindings/ruby
        run: |
          set -euo pipefail
          mkdir -p pkg
          version=$(ruby -r ./lib/disarm/version -e 'print Disarm::VERSION')
          gem build disarm.gemspec -o "pkg/disarm-${version}.gem"
          # A platform suffix here would mean the gemspec grew a `spec.platform`,
          # and the push loop would then treat it as a platform gem.
          test -f "pkg/disarm-${version}.gem"
      # Named `cross-gem-*` so the publish job's existing download pattern collects
      # it without a second `download-artifact` step.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: cross-gem-source
          path: bindings/ruby/pkg/*.gem

  # ── Tier 3 release gate (#159) ──────────────────────────────────
  # The gem must not ship unless the SAME exhaustive + formal regimen that gates
  # the PyPI wheel and the crates.io core (publish.yml) is green. Reused from
  # .github/workflows/tier3.yml. Release/dispatch only — the exhaustive suite is a
  # release gate, not a per-PR/-push cost (the PR-time `test` job already builds +
  # RSpecs the binding against the core).
  tier3:
    name: Tier 3 (exhaustive + formal)
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/tier3.yml

  publish:
    name: Publish to RubyGems
    needs: [test, cross-gems, source-gem, tier3]
    # Publish on a GitHub Release, or via a manual `workflow_dispatch` — the latter
    # is the recovery path when a release's gem build failed (e.g. binding drift)
    # but the registry version was never pushed. `gem push` of an existing version
    # fails by design, so a manual run can never overwrite a published gem.
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: rubygems
    # OIDC Trusted Publishing to RubyGems — no long-lived API key, and it satisfies
    # the account's MFA requirement (an API-key-only `gem push` is blocked by MFA).
    # Mirrors the PyPI/crates.io OIDC paths. Requires a Trusted Publisher configured
    # on rubygems.org for gem `disarm`, repo `raeq/disarm`, workflow
    # `publish-ruby.yml`, environment `rubygems`.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: cross-gem-*
          merge-multiple: true
          path: pkg
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "3.3"
      - name: Configure RubyGems credentials (OIDC trusted publishing)
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      # A partial publish is the case this has to survive. RubyGems can accept a
      # gem and still time the client out ("did not finish pushing"), and the
      # step runs under `bash -e`, so the v0.14.1 release aborted mid-loop with
      # four of five platforms live and `x86_64-linux` never attempted. Plain
      # re-running could not repair it: the retry died on the first gem that was
      # already published, before reaching the missing one — so the
      # workflow_dispatch recovery path this job documents did not work in the
      # one situation it exists for.
      #
      # Now a push that fails is checked against the registry rather than
      # abandoned. Already-live is not an error; anything else still fails the
      # job. The registry is the authority instead of the error text, which
      # RubyGems phrases several ways.
      - name: gem push
        run: |
          set -uo pipefail
          command -v jq >/dev/null || { echo "::error::jq is not available"; exit 1; }

          # Without nullglob an empty pkg/ iterates the literal string "pkg/*.gem",
          # which would push a non-existent file and then probe the registry with a
          # version and platform parsed out of the glob itself.
          shopt -s nullglob
          gems=(pkg/*.gem)
          if [ ${#gems[@]} -eq 0 ]; then
            echo "::error::no gems in pkg/ — the cross-gem artifacts did not download"
            exit 1
          fi

          # Three outcomes, not two: live, absent, and could-not-tell. Collapsing the
          # third into "absent" would report a network blip as a failed push and say
          # so in the log, which is the misleading half.
          registry_has() {
            local version=$1 platform=$2 attempt out
            for attempt in 1 2 3; do
              if out=$(curl -sSf --max-time 30 "https://rubygems.org/api/v1/versions/disarm.json" 2>/dev/null); then
                printf '%s' "$out" | jq -e --arg v "$version" --arg p "$platform" \
                  'any(.[]; .number == $v and .platform == $p)' >/dev/null && return 0
                return 1
              fi
              sleep $((attempt * 5))
            done
            return 2
          }

          failed=0
          for g in "${gems[@]}"; do
            if gem push "$g"; then
              continue
            fi
            base=$(basename "$g" .gem)              # disarm-0.14.1-x86_64-linux
            rest=${base#disarm-}                    # 0.14.1-x86_64-linux
            version=${rest%%-*}                     # 0.14.1
            platform=${rest#*-}                     # x86_64-linux
            [ "$platform" = "$version" ] && platform=ruby
            echo "push failed for $base; asking rubygems.org whether it is already live"
            registry_has "$version" "$platform"
            case $? in
              0) echo "  $version ($platform) is already published — continuing" ;;
              1) echo "::error::$version ($platform) is not on rubygems.org — the push genuinely failed"
                 failed=1 ;;
              2) echo "::error::could not reach rubygems.org after 3 attempts to check $version ($platform); not assuming either way"
                 failed=1 ;;
            esac
          done
          exit $failed
