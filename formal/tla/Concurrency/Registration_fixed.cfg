\* The fix (#1014): one registration gate, held by seal_registrations and by every
\* mutator from its seal check to the end of its write. That is the same shape as
\* the GIL the Python shim holds across the call, so GilAtomic = TRUE models it; the
\* public Rust API goes through the gate too. Three registrants race for one slot.
\* Expected: PASS (both invariants).
SPECIFICATION Spec
CONSTANTS
    Registrants = {1, 2, 3}
    Sealer = 4
    Max = 1
    GilAtomic = TRUE
INVARIANTS CapRespected NoMutationAfterSeal
CHECK_DEADLOCK TRUE
